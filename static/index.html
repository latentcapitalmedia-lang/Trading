<script>
/* The charting library paints from requestAnimationFrame, and browsers never
   fire rAF while the document is hidden. A chart opened in a background tab is
   fine — it paints the moment it is shown — but headless capture never gets
   that moment, so the canvas stays blank. Append ?raf=1 to the URL to paint
   from a timer instead. Nothing sets it in normal use. */
if (/(?:[?&])raf=1(?:&|$)/.test(location.search)) {
  window.requestAnimationFrame = function (cb) { return setTimeout(function () { cb(Date.now()); }, 16); };
  window.cancelAnimationFrame = function (id) { clearTimeout(id); };
}
</script>
